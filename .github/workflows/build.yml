name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest pyflakes numpy
      - run: python -m pyflakes flowhe.py textproc.py chunker.py tools/make_update.py
      - run: python -m pytest -q tests

  windows:
    needs: unit-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version
        shell: pwsh
        run: '"${{ github.run_number }}" | Out-File -Encoding ascii -NoNewline version.txt'

      - name: Write .env (only if secrets are set)
        shell: pwsh
        env:
          TRANSCRIBE_URL: ${{ secrets.TRANSCRIBE_URL }}
          TRANSCRIBE_TOKEN: ${{ secrets.TRANSCRIBE_TOKEN }}
        run: |
          if ($env:TRANSCRIBE_TOKEN) {
            "TRANSCRIBE_URL=$env:TRANSCRIBE_URL`nTRANSCRIBE_TOKEN=$env:TRANSCRIBE_TOKEN" | Out-File -Encoding utf8 .env
            Write-Host "secrets present: live transcription test enabled"
          } else { Write-Host "no secrets: UI-only self-test" }

      - name: Self-test from source (UI screenshots + optional live transcription)
        shell: pwsh
        env:
          FLOWHE_SELFTEST: "1"
          FLOWHE_SELFTEST_OUT: ${{ github.workspace }}\selftest\source
          FLOWHE_SELFTEST_WAV: ${{ github.workspace }}\tests\sample_he.wav
          FLOWHE_SELFTEST_PASTE: "1"
          FLOWHE_SELFTEST_E2E: "1"
          FLOWHE_FAKE_AUDIO: "1"
          FLOWHE_FAKE_TRANSCRIPT: "שלום, זו בדיקה מקצה לקצה"
          PYTHONUTF8: "1"
        run: |
          python flowhe.py
          if ($LASTEXITCODE -ne 0) { Get-Content selftest\source\selftest.json; exit 1 }
          Get-Content selftest\source\selftest.json

      - name: Build portable EXE
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Flow-HE --icon flowhe.ico
          --add-data "config.json;." --add-data "dictionary.json;." --add-data "snippets.json;."
          --add-data ".env.example;." --add-data "version.txt;."
          --hidden-import pystray._win32 --collect-all sounddevice --collect-all soundfile
          flowhe.py

      - name: Self-test the built EXE
        shell: pwsh
        run: |
          Copy-Item .env dist\ -ErrorAction SilentlyContinue
          $env:FLOWHE_SELFTEST = "1"
          $env:FLOWHE_SELFTEST_OUT = "$PWD\selftest\exe"
          $env:FLOWHE_SELFTEST_WAV = "$PWD\tests\sample_he.wav"
          $env:FLOWHE_SELFTEST_PASTE = "1"
          $env:FLOWHE_SELFTEST_E2E = "1"
          $env:FLOWHE_FAKE_AUDIO = "1"
          $env:FLOWHE_FAKE_TRANSCRIPT = "שלום, זו בדיקה מקצה לקצה"
          $p = Start-Process dist\Flow-HE.exe -PassThru -Wait
          Get-Content selftest\exe\selftest.json
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item dist\.env -ErrorAction SilentlyContinue

      - name: Real-mode run + second launch replaces the first
        shell: pwsh
        run: |
          $a = Start-Process dist\Flow-HE.exe -PassThru
          Start-Sleep 8
          if ($a.HasExited) { Get-Content dist\flow.log -ErrorAction SilentlyContinue; Get-Content "$env:LOCALAPPDATA\Flow-HE\crash.log" -ErrorAction SilentlyContinue; throw "first instance exited on its own" }
          $b = Start-Process dist\Flow-HE.exe -PassThru
          Start-Sleep 10
          Get-Content dist\flow.log -ErrorAction SilentlyContinue
          if (Test-Path "$env:LOCALAPPDATA\Flow-HE\crash.log") { Get-Content "$env:LOCALAPPDATA\Flow-HE\crash.log"; throw "crash.log written" }
          if (-not $a.HasExited) { throw "old instance still running" }
          if ($b.HasExited) { throw "new instance exited" }
          Stop-Process -Id $b.Id -Force
          Write-Host "takeover OK"

      - name: Self-update test (drop a newer version into updates/, app swaps itself)
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\upd"; New-Item -ItemType Directory $d | Out-Null
          Copy-Item dist\Flow-HE.exe $d\
          $env:FLOWHE_VERSION_OVERRIDE = "old"; $env:FLOWHE_UPDATE_TEST = "1"
          $p = Start-Process "$d\Flow-HE.exe" -PassThru
          Start-Sleep 8
          python tools/make_update.py dist\Flow-HE.exe ${{ github.run_number }} "$d\updates"
          Start-Sleep 30
          $log = Get-Content "$d\flow.log" -Raw -Encoding utf8
          Write-Host $log
          if ($log -notmatch "עדכון: old ->") { throw "update was not applied" }
          if ($log -notmatch "גרסה: ${{ github.run_number }}") { throw "new version did not start" }
          if (Test-Path "$d\updates\manifest.json") { throw "manifest not cleaned up" }
          if (Test-Path "$d\Flow-HE.old.exe") { throw "old exe not cleaned up" }
          Get-Process Flow-HE -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "self-update OK"

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist\Flow-HE.exe, .env.example, README.md pkg\
          Compress-Archive pkg\* Flow-HE-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Flow-HE-windows
          path: Flow-HE-windows.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-screenshots
          path: selftest/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Flow-HE-windows.zip
